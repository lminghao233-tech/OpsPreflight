[project]
name = "opspreflight"
version = "0.1.0"
description = "Evidence-driven Terraform change risk gate portfolio MVP"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["coverage>=7.6,<8", "httpx>=0.27,<1"]

[project.scripts]
opspreflight = "opspreflight.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opspreflight*"]

